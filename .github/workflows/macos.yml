name: 🍎 • CI

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.py"
      - '**/*.h'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cmake'
      - '**/CMakeLists.txt'
      - 'libs/**'
      - '.github/workflows/macos.yml'
      - 'cmake/**'
      - 'src/tests/**'
      - 'make_everything_dev'
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.py"
      - '**/*.h'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cmake'
      - '**/CMakeLists.txt'
      - 'libs/**'
      - '.github/workflows/macos.yml'
      - 'cmake/**'
      - 'src/tests/**'
      - 'make_everything_dev'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ macos-15, macos-26 ]
        compiler: [ clang++ ]
        ccompiler: [ clang ]

    name: 🍎 ${{matrix.os}} with ${{matrix.compiler}}
    runs-on: ${{matrix.os}}

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Remove existing 2to3 binary
      - name: Remove existing 2to3 binary
        run: sudo rm /usr/local/bin/2to3 || true

      # Install Homebrew dependencies (Boost and Qt6)
      - name: Install Homebrew Dependencies
        run: |
          brew update
          brew install boost qt@6
          # Ensure Qt6 is available in PATH
          echo "/opt/homebrew/opt/qt@6/bin" >> "$GITHUB_PATH"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "${{matrix.os}}-${{matrix.compiler}}-Release"
          variant: ccache
          save: true
          max-size: 10G

      - name: Create Build Environment (Debug)
        run: cmake -E make_directory ${{github.workspace}}/build_debug

      - name: Configure CMake (Debug)
        working-directory: ${{github.workspace}}/build_debug
        run: >
          cmake ${{github.workspace}}
          -DCMAKE_CXX_COMPILER=${{matrix.compiler}}
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build (Debug)
        working-directory: ${{github.workspace}}/build_debug
        run: cmake --build . --config Debug -j4

      - name: Test (Debug)
        run: ctest --test-dir build_debug -C Debug --output-on-failure --no-tests=error

      - name: Test summary (Debug)
        if: always()
        run: python3 src/tests/report_tests.py build_debug/test-results --expect siqad_tests gui_workflow_tests sim_job_workflow_tests document_export_tests clipboard_codec_tests developer_script_tests report_tests_tests

      - name: Create Build Environment (Release)
        run: cmake -E make_directory ${{github.workspace}}/build_release

      - name: Configure CMake (Release)
        working-directory: ${{github.workspace}}/build_release
        run: >
          cmake ${{github.workspace}}
          -DCMAKE_CXX_COMPILER=${{matrix.compiler}}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build (Release)
        working-directory: ${{github.workspace}}/build_release
        run: cmake --build . --config Release -j4 # all macOS runners provide at least 3 cores

      - name: Test (Release)
        run: ctest --test-dir build_release -C Release --output-on-failure --no-tests=error

      - name: Test summary (Release)
        if: always()
        run: python3 src/tests/report_tests.py build_release/test-results --expect siqad_tests gui_workflow_tests sim_job_workflow_tests document_export_tests clipboard_codec_tests developer_script_tests report_tests_tests

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build_debug/test-results/
            build_debug/Testing/Temporary/
            build_release/test-results/
            build_release/Testing/Temporary/
          if-no-files-found: error
