name: 🍎 • CI

on:
  push:
    branches: ["master"]
    paths:
      - "**/*.py"
      - '**/*.h'
      - '**/*.cc'
      - '**/*.cmake'
      - '**/CMakeLists.txt'
      - 'libs/**'
      - '.github/workflows/macos.yml'
  pull_request:
    branches: ["master"]
    paths:
      - "**/*.py"
      - '**/*.h'
      - '**/*.cc'
      - '**/*.cmake'
      - '**/CMakeLists.txt'
      - 'libs/**'
      - '.github/workflows/macos.yml'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ macos-14, macos-15, macos-26 ]
        compiler: [ clang++ ]
        ccompiler: [ clang ]

    name: 🍎 ${{matrix.os}} with ${{matrix.compiler}}
    runs-on: ${{matrix.os}}

    steps:
      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Install modern CMake before configuring; remove once macOS runners ship CMake >= 3.31 by default.
      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '4.1.2'

      # Remove existing 2to3 binary
      - name: Remove existing 2to3 binary
        run: sudo rm /usr/local/bin/2to3 || true

      # Install Homebrew dependencies (Boost and Qt5)
      - name: Install Homebrew Dependencies
        run: |
          brew update
          brew install boost qt@6
          # Ensure Qt6 is available in PATH
          echo "/opt/homebrew/opt/qt@6/bin" >> $GITHUB_PATH

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "${{matrix.os}}-${{matrix.compiler}}-Release"
          variant: ccache
          save: true
          max-size: 10G

      - name: Create Build Environment (Debug)
        run: cmake -E make_directory ${{github.workspace}}/build_debug

      # Boost 1.89 from Homebrew lacks component configs on Action runners; drop these once images ship them or we vendor Boost:
      # -DCMAKE_FIND_PACKAGE_PREFER_CONFIG, -DBoost_NO_BOOST_CMAKE, DCMAKE_POLICY_DEFAULT_CMP0167
      - name: Configure CMake (Debug)
        working-directory: ${{github.workspace}}/build_debug
        run: >
          cmake ${{github.workspace}}
          -DCMAKE_CXX_COMPILER=${{matrix.compiler}}
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=OFF
          -DBoost_NO_BOOST_CMAKE=ON
          -DCMAKE_POLICY_DEFAULT_CMP0167=OLD

      - name: Build and test (Debug)
        working-directory: ${{github.workspace}}/build_debug
        run: cmake --build . --config Release -j4 # all macOS runners provide at least 3 cores

      - name: Create Build Environment (Release)
        run: cmake -E make_directory ${{github.workspace}}/build_release

      # Boost 1.89 from Homebrew lacks component configs on Action runners; drop these once images ship them or we vendor Boost:
      # -DCMAKE_FIND_PACKAGE_PREFER_CONFIG, -DBoost_NO_BOOST_CMAKE, DCMAKE_POLICY_DEFAULT_CMP0167
      - name: Configure CMake (Release)
        working-directory: ${{github.workspace}}/build_release
        run: >
          cmake ${{github.workspace}}
          -DCMAKE_CXX_COMPILER=${{matrix.compiler}}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=OFF
          -DBoost_NO_BOOST_CMAKE=ON
          -DCMAKE_POLICY_DEFAULT_CMP0167=OLD

      - name: Build and test (Release)
        working-directory: ${{github.workspace}}/build_release
        run: cmake --build . --config Release -j4 # all macOS runners provide at least 3 cores
