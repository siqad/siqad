name: 🐧 • CI

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.py"
      - '**/*.h'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cmake'
      - '**/CMakeLists.txt'
      - 'libs/**'
      - '.github/workflows/ubuntu.yml'
      - 'cmake/**'
      - 'src/tests/**'
      - 'make_everything_dev'
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.py"
      - '**/*.h'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cmake'
      - '**/CMakeLists.txt'
      - 'libs/**'
      - '.github/workflows/ubuntu.yml'
      - 'cmake/**'
      - 'src/tests/**'
      - 'make_everything_dev'
  merge_group:

defaults:
  run:
    shell: bash

jobs:
  build_and_test:
    strategy:
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm ]
        compiler: [ g++-11, g++-12, g++-13, clang++-14, clang++-15, clang++-16 ]
        exclude:
          - os: ubuntu-22.04
            compiler: g++-13
          - os: ubuntu-22.04
            compiler: clang++-16
          - os: ubuntu-24.04
            compiler: clang++-14
          - os: ubuntu-24.04-arm
            compiler: g++-11
          - os: ubuntu-24.04-arm
            compiler: g++-12
          - os: ubuntu-24.04-arm
            compiler: g++-13
          - os: ubuntu-24.04-arm
            compiler: clang++-14
        include:
          - os: ubuntu-22.04
            compiler: g++-10
          - os: ubuntu-24.04
            compiler: g++-14
          - os: ubuntu-24.04
            compiler: clang++-17
          - os: ubuntu-24.04
            compiler: clang++-18
          - os: ubuntu-24.04-arm
            compiler: clang++-17
          - os: ubuntu-24.04-arm
            compiler: clang++-18

    name: 🐧 ${{matrix.os}} with ${{matrix.compiler}}
    runs-on: ${{matrix.os}}

    steps:
      - name: Install libraries, compiler, and Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -yq \
            cmake \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-tk \
            python3-venv \
            make \
            gcc \
            g++ \
            libgl1-mesa-dev \
            libboost-dev \
            libboost-filesystem-dev \
            libboost-system-dev \
            libboost-thread-dev \
            libboost-random-dev \
            libtbb-dev \
            ${{matrix.compiler}}
          if [ "${{matrix.os}}" = "ubuntu-22.04" ]; then
            sudo apt-get install -yq \
              qt6-base-dev qt6-tools-dev libqt6charts6-dev libqt6uitools6 libqt6svg6-dev libxkbcommon-dev
          elif [ "${{matrix.os}}" = "ubuntu-24.04" ] || [ "${{matrix.os}}" = "ubuntu-24.04-arm" ]; then
            sudo apt-get install -yq \
              qt6-base-dev qt6-tools-dev qt6-svg-dev qt6-charts-dev libqt6charts6 libqt6uitools6 libqt6svg6
          fi

      # - name: Verify Qt5UiTools Installation
      #   run: |
      #     dpkg -l | grep qttools5-dev || echo "qttools5-dev not installed"
      #     ls /usr/lib/$(uname -m)-linux-gnu/cmake/Qt5UiTools/Qt5UiToolsConfig.cmake || echo "Qt5UiToolsConfig.cmake not found"

      - name: Clone Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ccache
        if: matrix.os != 'ubuntu-24.04-arm'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: "${{matrix.os}}-${{matrix.compiler}}-Release"
          variant: ccache
          save: true
          max-size: 10G

      - name: Create Build Environment (Debug)
        run: cmake -E make_directory ${{github.workspace}}/build_debug

      - name: Configure CMake (Debug)
        working-directory: ${{github.workspace}}/build_debug
        run: |
          cmake ${{github.workspace}} \
            -DCMAKE_CXX_COMPILER=${{matrix.compiler}} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build (Debug)
        working-directory: ${{github.workspace}}/build_debug
        run: cmake --build . --config Debug -j4

      - name: Test (Debug)
        run: ctest --test-dir build_debug -C Debug --output-on-failure --no-tests=error

      - name: Test summary (Debug)
        if: always()
        run: python3 src/tests/report_tests.py build_debug/test-results --expect siqad_tests gui_workflow_tests sim_job_workflow_tests document_export_tests clipboard_codec_tests developer_script_tests report_tests_tests

      - name: Create Build Environment (Release)
        run: cmake -E make_directory ${{github.workspace}}/build_release

      - name: Configure CMake (Release)
        working-directory: ${{github.workspace}}/build_release
        run: |
          cmake ${{github.workspace}} \
            -DCMAKE_CXX_COMPILER=${{matrix.compiler}} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build (Release)
        working-directory: ${{github.workspace}}/build_release
        run: cmake --build . --config Release -j4

      - name: Test (Release)
        run: ctest --test-dir build_release -C Release --output-on-failure --no-tests=error

      - name: Test summary (Release)
        if: always()
        run: python3 src/tests/report_tests.py build_release/test-results --expect siqad_tests gui_workflow_tests sim_job_workflow_tests document_export_tests clipboard_codec_tests developer_script_tests report_tests_tests

      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build_debug/test-results/
            build_debug/Testing/Temporary/
            build_release/test-results/
            build_release/Testing/Temporary/
          if-no-files-found: error
